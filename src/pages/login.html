<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Smed | Login & Registration </title>
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
	<link rel="icon" href="../assets/icons/icon_principal.webp" type="image/png">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
	<link rel="stylesheet" href="../components/BarraNavegacion/BarraNavegacion.css">
	<link rel="stylesheet" href="../styles/login_style.css">
</head>

<body>
	<nav-bar login="true"></nav-bar>
	<div class="wrapper">
		<!-------------------------formato de caja---------------->
		<div class="form-box">
			<!-------------------------formulario de logeo ---------------->
			<div class="login-container" id="login">
				<div class="top" style="color: #ffff; font-size: 30px; text-align: center; padding: 10px 0 30px 0;">
					Inicia Sesion
				</div>
				<form id="loginForm" method="post" action="http://localhost:4000/login">
					<div class="input-box">
						<input type="email" class="input-field" placeholder="Usuario o correo" id="email" name="email"
							required>
						<i class="bx bx-user"></i>
					</div>
					<div class="input-box">
						<input type="password" class="input-field" placeholder="password" id="password" name="password"
							required>
						<i class="bx bx-lock-alt"></i>
					</div>
					<div class="input-box">
						<input type="submit" class="submit" id="login_in" value="Ingresar">
					</div>
				</form>
				<div class="two-col">
					<div class="one">
						<input type="checkbox" id="login-check">
						<label for="login-check"> Recordar !</label>
					</div>
					<div class="two">
						<label><a href="#"> Olvide la Contraseña </a></label>
					</div>
				</div>
			</div>

			<!-------------------------formulario de registro ---------------->
			<div class="register-container" id="register">
				<div class="top" style="color: #ffff; font-size: 30px; text-align: center; padding: 10px 0 30px 0;">
					Registrarse
				</div>
				<!---inicio de etiqueta formulario para hacer el metodo post-->
				<form id="registerForm" method="post" action="http://localhost:4000/register">
					<div class="two-form">
						<div class="input-box">
							<input type="text" id="nombre" class="input-field" name="nombre" placeholder="nombre"
								required>
							<i class="bx bx-user"></i>
						</div>
						<div class="input-box">
							<input type="text" id="apellido" class="input-field" name="apellido" placeholder="apellido"
								required>
							<i class="bx bx-user"></i>
						</div>
					</div>
					<div class="input-box">
						<input type="email" id="email" class="input-field" name="email" placeholder="Email" required>
						<i class="bx bx-envelope"></i>
					</div>
					<div class="input-box">
						<input type="password" id="password" class="input-field" name="password" placeholder="password"
							required>
						<i class="bx bx-lock-alt"></i>
					</div>
					<div class="input-box">
						<input type="password" id="confirmContraseña" class="input-field"
							placeholder="Confirmar Contraseña" required>
						<i class="bx bx-lock-alt"></i>
					</div> <!-- se agrega un segundo campo de verficacion de contraseña en el area de registro-->

					<div class="input-box">
						<input type="submit" class="submit" id="confirmation" value="Registrarse">
					</div>
				</form>

				<div class="two-col">
					<div class="one">
						<input type="checkbox" id="register-check" name="recordar">
						<label for="register-check"> Recordar !</label>
					</div>
					<div class="two">
						<label><a href="#">Terminos & Condiciones </a></label>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="../utils/Functions.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
		crossorigin="anonymous"></script>
	<script type="module" src="../components/ComponentesBase.js" defer></script>
</body>

</html>
